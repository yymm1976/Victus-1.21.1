modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "${mod_id}.png"
authors = "Ming"
description = '''
Victus is a mod about Hearts and how to use them in interesting ways. This is an unofficial NeoForge port.
'''

[[mixins]]
config = "${mod_id}.mixins.json"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[dependencies.${ mod_id }]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"


[[dependencies.${ mod_id }]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# L2Tabs 可选兼容：安装后物品栏出现心相面板标签
[[dependencies.${ mod_id }]]
modId = "l2tabs"
type = "optional"
versionRange = "[3.0.5,)"
ordering = "AFTER"
side = "BOTH"